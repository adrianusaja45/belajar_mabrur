name: belajar_mabrur
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # Utilities
  http: ^1.2.0
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.8
  
  # Permission Handler
  permission_handler: ^12.0.1

  # --- GANTI INI: DARI VIDEO CONFERENCE KE LIVE AUDIO ROOM ---
  # Paket ini memiliki fitur minimize (overlay) bawaan

  # --- FIREBASE ---
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.10
  
  # Notifications
  flutter_local_notifications: ^19.5.0
  
  # Google Auth
  googleapis_auth: ^1.4.1
  googleapis: ^11.0.0
  
  # --- GOOGLE MAPS ---
  google_maps_flutter: ^2.5.3
  google_maps_flutter_platform_interface: ^2.4.0
  google_maps_flutter_android: ^2.4.0
  
  # --- LOKASI ---
  geolocator: ^10.1.0
  uuid: ^4.0.0
  zego_uikit: ^2.28.39
  zego_express_engine: ^3.23.0
  zego_uikit_prebuilt_live_audio_room: ^3.16.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/service_account.json

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo_apk.png" 
  min_sdk_android: 21
  remove_alpha_ios: true